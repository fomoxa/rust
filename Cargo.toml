[package]
name = "fomoxa-net"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
description = "The Fomoxa runtime for Rust: framing, schema handshake, heartbeat and a non-blocking TCP/UDP tick loop. Codecs come from fomoxac. No dependencies, no async runtime, no engine."
license = "Apache-2.0"
keywords = ["fomoxa", "protocol", "binary", "networking", "codec"]
categories = ["network-programming", "encoding"]
repository = "https://github.com/fomoxa/rust"
homepage = "https://fomoxa.github.io"
readme = "README.md"

[dependencies]

# Test-only, and only for one reason: examples/demo/src/models/ is annotated
# source, and `#[network]` has to exist for rustc to accept it. The attributes
# are read by fomoxac at generation time and compile away to nothing. The
# library itself still depends on nothing.
[dev-dependencies]
fomoxa-attributes = "0.1.1"
