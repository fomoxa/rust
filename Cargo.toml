[package]
name = "cyclone-net"
version = "0.1.0"
edition = "2021"
description = "Minimal, platform-agnostic Rust runtime for Cyclone: TCP transport, message framing, heartbeat, and typed message handlers for codecs generated by cyclonec. No async runtime, no game engine - just std."
license = "Apache-2.0"
keywords = ["cyclone", "networking", "codec", "tcp", "protocol"]
categories = ["network-programming"]
repository = "https://github.com/cyclone-protocol/cyclone-rust"
homepage = "https://cyclone-protocol.github.io"
readme = "README.md"

# std only - the same "no dependencies, nothing here could need one" rule
# cyclonec itself follows. A background thread per connection (see
# connection.rs) does the job an async runtime would, without asking every
# consumer of this crate to pick one.
[dependencies]

# Examples only: the [network]/[codec] attributes on examples/shared/player.rs
# are read by cyclonec at generation time and compiled away to nothing at
# runtime - see examples/shared/cyclone.codec.rs, which itself depends on
# nothing. This crate's own library code never depends on this.
[dev-dependencies]
cyclone-attributes = "0.1.0"
